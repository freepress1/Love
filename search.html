<!DOCTYPE html>
<html>
<head>
  <title>Search</title>
</head>
<body>
  <h2>Site Search</h2>
  <input type="text" id="siteSearchInput" placeholder="Type to search...">
  <button onclick="searchSite()">Search</button>
  <ul id="resultsList"></ul>
  <script>
    async function searchSite() {
      const query = document.getElementById('siteSearchInput').value.toLowerCase();
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = 'Loading...';
      try {
        const response = await fetch('search-index.json');
        const data = await response.json();
        const results = data.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.content.toLowerCase().includes(query)
        );
        resultsList.innerHTML = '';
        if (results.length === 0) {
          resultsList.innerHTML = '<li>No results found.</li>';
        } else {
          results.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${item.url}">${item.title}</a><p>${item.content}</p>`;
            resultsList.appendChild(li);
          });
        }
      } catch (error) {
        resultsList.innerHTML = '<li>Error loading search data.</li>';
        console.error('Search error:', error);
      }
    }

    // Auto-populate search input from URL query string
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q');
      if (query) {
        document.getElementById('siteSearchInput').value = query;
        searchSite();
      }
    });

    document.getElementById('siteSearchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        searchSite();
      }
    });
  </script>
</body>
</html>
